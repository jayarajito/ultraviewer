name: CI

# Fast, credential-free checks. No AWS, no cluster access. The slow image build and its
# smoke test run in deploy-int.yml.

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Helm chart (lint, render, schema, guard rails)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Verify chart
        run: bash scripts/helm-verify.sh

  dockerfile:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 \
            hadolint --failure-threshold error - < server/Dockerfile

  python:
    name: Security-group script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test
        working-directory: scripts/whitelist-public-ip
        run: |
          python -m py_compile whitelist-runner-ip-and-rm.py
          python -m unittest -v test_whitelist

  shell-and-workflows:
    name: shellcheck and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 --severity=warning \
            scripts/smoke-test-server-image.sh scripts/helm-verify.sh
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
