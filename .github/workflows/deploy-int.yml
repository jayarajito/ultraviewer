name: Deploy jkr-server (int)

# Builds the JustKeepRemote server image FROM SOURCE (pinned upstream rustdesk-server +
# server/Dockerfile), proves the image with a smoke test, pushes it to ECR with an
# immutable git-SHA tag and deploys it to the jkr-int namespace. Same pattern as the
# lotto/my-cv pipelines: all build + test work happens BEFORE any cluster access, then
# the runner IP is temporarily allowlisted on the EC2 security group for the Kubernetes
# API, a manual GitHub issue approval gates the deploy, and the IP rule is always
# removed afterwards.
#
# Two jobs on purpose: the Rust compile takes ~15-20 min, and it must not keep the
# security-group rule open or eat into the deploy job's timeout.

on:
  push:
    branches: [development]
    paths:
      - "server/**"
      - "helm/jkr-server/**"
      - "scripts/whitelist-public-ip/**"
      - "scripts/smoke-test-server-image.sh"
      - ".github/workflows/deploy-int.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for the DEPLOY job: ubuntu-latest now, or k8s-deployer after a self-hosted runner is ready (the image build always runs on ubuntu-latest)"
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - k8s-deployer
      approver:
        description: "Optional GitHub username or team that must approve the temporary IP allowlist"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Serialize int deploys; never cancel mid-deploy as that could leave the temporary
  # security-group rule in place.
  group: jkr-int
  cancel-in-progress: false

env:
  # Upstream server source, pinned to a FULL commit SHA (no moving ref). To upgrade: change
  # this value, run CI + this workflow on int, then promote to prod. To build from your own
  # fork instead, change UPSTREAM_REPO as well.
  UPSTREAM_REPO: rustdesk/rustdesk-server
  UPSTREAM_REF: 873230e35a8805de7fd057e7eb763c46f7a174ef # v1.1.17 + "fix: key file perm (#705)"

jobs:
  build:
    name: Build, test and push image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: int
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.image.outputs.tag }}
      ref: ${{ steps.image.outputs.ref }}
    env:
      ECR_REGION: us-east-1
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECR_REPO_NAME: jkr-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the pinned upstream rustdesk-server
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: vendor/rustdesk-server
          submodules: recursive
          persist-credentials: false

      - name: Verify the upstream checkout is exactly what is pinned
        shell: bash
        run: |
          set -euo pipefail
          got="$(git -C vendor/rustdesk-server rev-parse HEAD)"
          test "$got" = "$UPSTREAM_REF" || { echo "::error::upstream HEAD $got != pinned $UPSTREAM_REF"; exit 1; }
          test -f vendor/rustdesk-server/libs/hbb_common/Cargo.toml \
            || { echo "::error::hbb_common submodule is missing"; exit 1; }
          # sqlx::query! checks SQL against this committed schema DB at COMPILE time.
          test -f vendor/rustdesk-server/db_v2.sqlite3 \
            || { echo "::error::db_v2.sqlite3 missing from upstream (needed by sqlx at compile time)"; exit 1; }
          # The Dockerfile's privacy patch deletes this exact call. If an upstream bump moved
          # or renamed it, sed would silently do nothing and the phone-home would ship.
          grep -q 'crate::common::check_software_update();' vendor/rustdesk-server/src/main.rs \
            || { echo "::error::phone-home call not found where server/Dockerfile expects it - re-check the patch for this upstream ref"; exit 1; }
          echo "upstream @ $got verified"

      - name: Compute immutable image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ECR_REPOSITORY:-}" ]; then
            echo "::error::vars.ECR_REPOSITORY is not set"; exit 1
          fi
          # Must be the FULL ECR URI, not a bare name, or Docker will try to push to
          # Docker Hub (401 insufficient scopes). Expected form:
          #   <account>.dkr.ecr.<region>.amazonaws.com/jkr-server
          case "$ECR_REPOSITORY" in
            *.dkr.ecr.*.amazonaws.com/*) : ;;
            *)
              echo "::error::vars.ECR_REPOSITORY must be the full ECR URI, e.g. <account-id>.dkr.ecr.us-east-1.amazonaws.com/jkr-server (got '$ECR_REPOSITORY')"
              exit 1 ;;
          esac
          # Guard against copying another app's variable value (e.../lotto, e.../my-cv):
          # we would push this image into THEIR repository.
          if [ "${ECR_REPOSITORY##*/}" != "$ECR_REPO_NAME" ]; then
            echo "::error::vars.ECR_REPOSITORY points at '${ECR_REPOSITORY##*/}' but this workflow publishes '$ECR_REPO_NAME'"
            exit 1
          fi
          short_sha="${GITHUB_SHA::12}"
          echo "tag=$short_sha" >> "$GITHUB_OUTPUT"
          echo "ref=$ECR_REPOSITORY:$short_sha" >> "$GITHUB_OUTPUT"
          echo "Image will be tagged: $ECR_REPOSITORY:$short_sha"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ECR tags are IMMUTABLE. Re-running a workflow for a commit whose image was already
      # pushed (e.g. a later step failed) must reuse it instead of failing on the push.
      - name: Check whether this tag already exists in ECR
        id: ecr
        shell: bash
        run: |
          set -uo pipefail
          tag="${{ steps.image.outputs.tag }}"
          set +e
          out="$(aws ecr describe-images --repository-name "$ECR_REPO_NAME" --region "$ECR_REGION" \
                   --image-ids imageTag="$tag" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $ECR_REPOSITORY:$tag already exists - skipping build and push."
          elif printf '%s' "$out" | grep -q 'ImageNotFoundException'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not query ECR: $out"; exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.ecr.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      # Build into the local daemon first (NOT pushed yet) so the exact bytes we test are
      # the exact bytes we push.
      - name: Build image (from source)
        if: steps.ecr.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: vendor/rustdesk-server
          file: server/Dockerfile
          build-args: |
            DISABLE_UPDATE_CHECK=1
          load: true
          push: false
          tags: local/jkr-server:ci
          # Avoid orphaned untagged attestation manifests in the ECR repository.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=jkr-server
          cache-to: type=gha,mode=max,scope=jkr-server

      - name: Smoke-test the image (hardened, as Kubernetes runs it)
        if: steps.ecr.outputs.exists != 'true'
        run: bash scripts/smoke-test-server-image.sh local/jkr-server:ci

      - name: Push image to ECR
        if: steps.ecr.outputs.exists != 'true'
        run: |
          set -euo pipefail
          docker tag local/jkr-server:ci "${{ steps.image.outputs.ref }}"
          docker push "${{ steps.image.outputs.ref }}"

      - name: Report ECR vulnerability scan findings
        # Non-blocking: surface scan-on-push results in the run summary.
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          tag="${{ steps.image.outputs.tag }}"
          echo "Waiting for ECR scan of $ECR_REPOSITORY:$tag ..."
          aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPO_NAME" \
            --region "$ECR_REGION" \
            --image-id imageTag="$tag" 2>/dev/null || echo "Scan wait timed out; continuing."

          findings="$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPO_NAME" \
            --region "$ECR_REGION" \
            --image-id imageTag="$tag" \
            --query 'imageScanFindings.findingSeverityCounts' \
            --output json 2>/dev/null || echo '{}')"

          {
            echo "## ECR image scan"
            echo
            echo "Image: \`$ECR_REPOSITORY:$tag\`"
            echo
            echo "Severity counts: \`$findings\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to jkr-int
    needs: build
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: int
    permissions:
      contents: read
      issues: write
    env:
      KUBE_NAMESPACE: jkr-int
      HELM_RELEASE: jkr-server
      CHART_DIR: helm/jkr-server
      VALUES_FILE: helm/jkr-server/values-int.yaml
      ECR_REGION: us-east-1
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
      # Public DNS name / IP clients use to reach the relay. GitHub Environment variable
      # (Settings > Environments > int > Variables). Must resolve from inside the pod.
      RELAY_HOST: ${{ vars.RELAY_HOST }}
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Fail on bad configuration BEFORE the security group is touched.
      - name: Validate configuration (before any cluster access)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_TAG" || { echo "::error::the build job produced no image tag"; exit 1; }
          test -n "$KUBECONFIG_B64" || { echo "::error::secret KUBECONFIG_B64 is not configured"; exit 1; }
          test -n "$RELAY_HOST" || { echo "::error::Environment variable RELAY_HOST is not set (the public DNS name or IP clients use for the relay)"; exit 1; }
          if ! [[ "$RELAY_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$ ]]; then
            echo "::error::RELAY_HOST must be a bare host name or IPv4 (no scheme, no port, no spaces): '$RELAY_HOST'"; exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.ECR_REGION }}

      # ----------------------------------------------------------------------
      # Cluster access: allowlist runner IP -> approval -> deploy -> remove IP.
      # ----------------------------------------------------------------------
      - name: Collect hosted runner network details
        id: runner_details
        shell: bash
        run: |
          set -euo pipefail
          public_ipv4="$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)"
          echo "public_ipv4=$public_ipv4" >> "$GITHUB_OUTPUT"
          {
            echo "## jkr-server int deployment"
            echo
            echo "- Image: \`$ECR_REPOSITORY:$IMAGE_TAG\`"
            echo "- Relay host: \`$RELAY_HOST\`"
            echo "- Public IPv4: \`$public_ipv4\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install security-group script dependency
        run: python -m pip install --disable-pip-version-check --quiet boto3

      - name: Automatically allowlist active runner IP
        env:
          RUNNER_PUBLIC_IPV4: ${{ steps.runner_details.outputs.public_ipv4 }}
          SECURITY_GROUP_ID: ${{ vars.K8S_SECURITY_GROUP_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python scripts/whitelist-public-ip/whitelist-runner-ip-and-rm.py

      - name: Wait for temporary security-group approval
        uses: trstringer/manual-approval@v1.13.1
        with:
          secret: ${{ github.token }}
          approvers: ${{ inputs.approver || github.actor }}
          minimum-approvals: 1
          issue-title: "Approve Kubernetes API access for jkr-server int deployment"
          issue-body: |
            The workflow added the public IPv4 below to the EC2 security group
            inbound rule for TCP 6443. Verify it, then comment `approve`.

            - Image: `${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}`
            - Public IPv4: `${{ steps.runner_details.outputs.public_ipv4 }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Approval waits until the 30-minute job timeout. If it expires, rerun
            and use the new IP shown in the new issue.
          exclude-workflow-initiator-as-approver: false
          fail-on-denial: true
          polling-interval-seconds: 10

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure cluster access
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 "$RUNNER_TEMP/kube"
          echo "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          export KUBECONFIG="$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

          server="$(kubectl config view --minify -o jsonpath='{.clusters[*].cluster.server}')"
          echo "Kubernetes API server: $server"

          # Retry for ~2 minutes: the SG rule can race the first connection.
          attempt=1
          max_attempts=12
          until kubectl version --request-timeout=10s >/dev/null 2>&1; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Could not reach the Kubernetes API after $max_attempts attempts."
              kubectl version --request-timeout=10s
              exit 1
            fi
            echo "API not reachable yet (attempt $attempt/$max_attempts); retrying in 10s..."
            attempt=$((attempt + 1))
            sleep 10
          done

          echo "Connected to the Kubernetes API."
          kubectl auth can-i create deployments --namespace "$KUBE_NAMESPACE"

      - name: Ensure namespace exists
        run: kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or refresh the ECR image pull secret
        shell: bash
        run: |
          set -euo pipefail
          # The self-managed kubelet does not auto-authenticate to ECR; refresh this
          # docker-registry secret each deploy (ECR tokens expire ~12h).
          ecr_token="$(aws ecr get-login-password --region "$ECR_REGION")"
          kubectl create secret docker-registry ecr-pull \
            --namespace "$KUBE_NAMESPACE" \
            --docker-server="${ECR_REPOSITORY%%/*}" \
            --docker-username=AWS \
            --docker-password="$ecr_token" \
            --dry-run=client -o yaml | kubectl apply -f -

      # The server keypair lives on the volume and every client pins its PUBLIC key.
      # Remember it so we can prove the deploy did not change it.
      - name: Record the current server public key (if a server already runs)
        id: keybefore
        shell: bash
        run: |
          set -uo pipefail
          key="$(kubectl exec --namespace "$KUBE_NAMESPACE" "deploy/$HELM_RELEASE" -c hbbs -- cat /data/id_ed25519.pub 2>/dev/null | tr -d '\r\n' || true)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          if [ -n "$key" ]; then echo "Existing server public key: $key"; else echo "No running server yet (first install)."; fi

      - name: Lint the Helm chart
        run: |
          helm lint "$CHART_DIR" \
            --values "$VALUES_FILE" \
            --set image.repository="$ECR_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --set-string relayHost="$RELAY_HOST"

      - name: Deploy with Helm
        run: |
          helm upgrade --install "$HELM_RELEASE" "$CHART_DIR" \
            --namespace "$KUBE_NAMESPACE" \
            --create-namespace \
            --values "$VALUES_FILE" \
            --set image.repository="$ECR_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --set-string relayHost="$RELAY_HOST" \
            --wait --timeout 10m --rollback-on-failure

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/"$HELM_RELEASE" \
            --namespace "$KUBE_NAMESPACE" --timeout=5m
          kubectl get pods,svc,pvc --namespace "$KUBE_NAMESPACE" -o wide

      - name: Smoke test (relay configured, ports reachable in-cluster)
        shell: bash
        run: |
          set -euo pipefail

          # 1) hbbs silently drops a relay host it cannot resolve; the pod would look healthy
          #    while every relayed connection fails. Prove the relay list is what we asked for.
          relay_port="$(kubectl get svc "$HELM_RELEASE" --namespace "$KUBE_NAMESPACE" \
            -o jsonpath='{.spec.ports[?(@.name=="relay")].port}')"
          expect="relay-servers=[\"$RELAY_HOST:$relay_port\"]"
          logs="$(kubectl logs "deploy/$HELM_RELEASE" -c hbbs --namespace "$KUBE_NAMESPACE" --tail=200)"
          echo "$logs" | tail -n 20
          if ! grep -Fq "$expect" <<<"$logs"; then
            echo "::error::hbbs is not advertising the relay ($expect). Check that RELAY_HOST resolves."
            exit 1
          fi
          echo "hbbs advertises $RELAY_HOST:$relay_port"

          # 2) Every TCP port answers on the Service (through Cilium, to the hostNetwork pod).
          ports="$(kubectl get svc "$HELM_RELEASE" --namespace "$KUBE_NAMESPACE" \
            -o jsonpath='{range .spec.ports[?(@.protocol=="TCP")]}{.port}{" "}{end}')"
          echo "TCP ports to probe: $ports"
          # SC2016: the single-quoted script must expand inside the pod, not here.
          # SC2086: $ports is intentionally word-split into positional args.
          # shellcheck disable=SC2016,SC2086
          kubectl run "jkr-smoke-$RANDOM" \
            --namespace "$KUBE_NAMESPACE" \
            --rm -i --restart=Never \
            --image=busybox:1.37.0 \
            --env "TARGET=$HELM_RELEASE.$KUBE_NAMESPACE.svc.cluster.local" \
            --command -- sh -c 'for p in "$@"; do if nc -z -w 5 "$TARGET" "$p"; then echo "ok   tcp/$p"; else echo "FAIL tcp/$p"; exit 1; fi; done' sh $ports

      - name: Verify the server key is unchanged and publish it
        shell: bash
        env:
          KEY_BEFORE: ${{ steps.keybefore.outputs.key }}
        run: |
          set -euo pipefail
          after="$(kubectl exec --namespace "$KUBE_NAMESPACE" "deploy/$HELM_RELEASE" -c hbbs -- cat /data/id_ed25519.pub | tr -d '\r\n')"
          test -n "$after" || { echo "::error::could not read the server public key"; exit 1; }
          if [ -n "$KEY_BEFORE" ] && [ "$KEY_BEFORE" != "$after" ]; then
            echo "::error::THE SERVER PUBLIC KEY CHANGED (was $KEY_BEFORE, now $after). The volume was probably re-created; every client configured with the old key will be rejected."
            exit 1
          fi
          {
            echo "## Server public key (jkr-int)"
            echo
            echo "\`$after\`"
            echo
            if [ -z "$KEY_BEFORE" ]; then
              echo "> **First install.** The keypair was just generated on the volume. Back up the PRIVATE key now (see helm/jkr-server/README.md). Never commit it."
            else
              echo "> Unchanged by this deploy."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Server public key: $after"

      - name: Show deployed release
        if: always()
        run: helm list --namespace "$KUBE_NAMESPACE" || true

      - name: Remove temporary runner IP from security group
        if: always()
        env:
          RUNNER_PUBLIC_IPV4: ${{ steps.runner_details.outputs.public_ipv4 }}
          SECURITY_GROUP_ID: ${{ vars.K8S_SECURITY_GROUP_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CLEANUP: "true"
        run: python scripts/whitelist-public-ip/whitelist-runner-ip-and-rm.py
