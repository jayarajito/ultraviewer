name: Build client (Windows)

# Builds the JustKeepRemote Windows client from source: the pinned upstream RustDesk checkout
# plus our patches (client/apply-jkr-patches.ps1). Uploads a zip as a workflow artifact and,
# when asked, creates a DRAFT GitHub release for you to review and publish.
#
# Manual only. A cold build takes well over an hour (vcpkg compiles ffmpeg/aom, then a large
# Rust release build); vcpkg binary packages and cargo output are cached for later runs.
#
# This recipe mirrors the one verified on a local machine (hwcodec + Flutter 3.24.5 + bridge
# codegen 1.80.1) and upstream's own CI. It has NOT yet been run on GitHub: expect to iterate.
#
# Deliberately NOT done (upstream's CI does them): replacing the Flutter engine with a prebuilt
# binary from github.com/rustdesk/engine (we do not pull unreviewed binaries into the build;
# our locally built client works without it) and the Flutter dropdown-menu patch.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also create a DRAFT GitHub release with the zip"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Tag for the draft release, e.g. v0.1.0 (required when release is ticked)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: client-build
  cancel-in-progress: false

env:
  # Upstream client source, pinned to a FULL commit SHA (+ the hbb_common submodule it points at).
  UPSTREAM_REPO: rustdesk/rustdesk
  UPSTREAM_REF: 04360797addc71138ea30e6c630c073811d9a1d5
  UPSTREAM_HBB_COMMON: fae47e024dd83cef6aaecde0aa7d11731df11649
  # Toolchain versions: same as upstream CI for Windows.
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  LLVM_VERSION: "15.0.6"
  # vcpkg commit upstream builds with (changing it changes every native dependency).
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # What the client talks to. Both are PUBLIC values (the key is the server's PUBLIC key).
  SERVER_HOST: jkr.jayarajnarayanan.in
  SERVER_KEY: "WBQWPJXUFJcOp+ndfi9d6B+IOh719m5PNsa+45G6H0s="

jobs:
  check-inputs:
    name: Check inputs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out this repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The app compares its own version (client/VERSION, compiled in) with the newest release tag
      # to decide whether to show "new version available". A tag that differs from VERSION would
      # make every installed copy think it is outdated (or never notice a real update).
      - name: Validate the release tag against client/VERSION
        env:
          RELEASE: ${{ inputs.release }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < client/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::client/VERSION must be MAJOR.MINOR.PATCH (got '$version')"; exit 1; }
          if [ "$RELEASE" = "true" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::release_tag must be exactly v$version (client/VERSION is $version); got '$TAG'. Bump client/VERSION first."; exit 1
          fi
          echo "Building JustKeepRemote $version"

  bridge:
    name: Generate Flutter-Rust bridge
    needs: check-inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out upstream source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Verify the checkout is exactly what is pinned
        run: |
          set -euo pipefail
          got="$(git rev-parse HEAD)"
          test "$got" = "$UPSTREAM_REF" || { echo "::error::HEAD $got != pinned $UPSTREAM_REF"; exit 1; }
          sub="$(git -C libs/hbb_common rev-parse HEAD)"
          test "$sub" = "$UPSTREAM_HBB_COMMON" || { echo "::error::hbb_common $sub != pinned $UPSTREAM_HBB_COMMON"; exit 1; }

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates clang cmake curl gcc git g++ libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: jkr-bridge

      - name: Install Flutter (bridge flavour)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install bridge code generator
        run: |
          set -euo pipefail
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_VERSION" --features "uuid" --locked
          # extended_text 14 needs a newer Dart than 3.22.3 ships; downgrade for resolution only.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Generate the bridge
        run: |
          set -euo pipefail
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          test -s src/bridge_generated.rs
          test -s flutter/lib/generated_bridge.dart

      - name: Upload bridge files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-files
          if-no-files-found: error
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart

  build:
    name: Build and package
    needs: bridge
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      VCPKG_ROOT: C:\vcpkg-jkr
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Check out this repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check out upstream source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: vendor/rustdesk
          submodules: recursive
          persist-credentials: false

      - name: Verify the checkout is exactly what is pinned
        shell: bash
        run: |
          set -euo pipefail
          got="$(git -C vendor/rustdesk rev-parse HEAD)"
          test "$got" = "$UPSTREAM_REF" || { echo "::error::HEAD $got != pinned $UPSTREAM_REF"; exit 1; }
          sub="$(git -C vendor/rustdesk/libs/hbb_common rev-parse HEAD)"
          test "$sub" = "$UPSTREAM_HBB_COMMON" || { echo "::error::hbb_common $sub != pinned $UPSTREAM_HBB_COMMON"; exit 1; }

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-files
          path: vendor/rustdesk

      - name: Check the bridge files landed in the right place
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/rustdesk/src/bridge_generated.rs \
            || { echo "::error::bridge_generated.rs not found; artifact layout changed"; find vendor/rustdesk -name 'bridge_generated*' -o -name 'generated_bridge*'; exit 1; }
          test -s vendor/rustdesk/flutter/lib/generated_bridge.dart

      # Our changes to the client: server + key, name, no phone-home, locked settings, branding.
      # Fails if any anchor line moved.
      - name: Apply JustKeepRemote patches
        shell: pwsh
        run: |
          ./client/apply-jkr-patches.ps1 -Key $env:SERVER_KEY -ServerHost $env:SERVER_HOST `
            -Vendor "$env:GITHUB_WORKSPACE\vendor\rustdesk"

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: jkr-windows-2022
          workspaces: vendor/rustdesk

      # vcpkg at upstream's commit, cloned directly (no third-party action). Binary packages are
      # cached in a plain directory so later runs skip compiling ffmpeg/aom.
      - name: Set up vcpkg
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT_ID"
          "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Cache vcpkg binary packages
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: C:\vcpkg-bincache
          key: vcpkg-bin-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vendor/rustdesk/vcpkg.json', 'vendor/rustdesk/res/vcpkg/**', 'vendor/rustdesk/res/vcpkg-triplets/**') }}

      - name: Install vcpkg dependencies (static triplet)
        shell: bash
        working-directory: vendor/rustdesk
        env:
          # hwcodec links ffmpeg statically; the HOST triplet must be the static one too, otherwise
          # ffmpeg is built only for x64-windows and the static include dir stays empty.
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
          VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-bincache,readwrite"
        run: |
          set -uo pipefail
          mkdir -p /c/vcpkg-bincache
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            echo "::group::vcpkg logs"
            find "$VCPKG_ROOT/buildtrees" -name '*.log' | while read -r f; do echo "== $f"; tail -n 60 "$f"; done
            echo "::endgroup::"
            exit 1
          fi
          # Fail in minutes, not after the long Rust build, if ffmpeg is missing for hwcodec.
          test -f "$VCPKG_ROOT/installed/x64-windows-static/include/libavcodec/avcodec.h" \
            || { echo "::error::ffmpeg headers missing from x64-windows-static"; exit 1; }

      # Flutter's Windows plugin build creates very deep paths. A short junction keeps them
      # under MAX_PATH (same trick as the local build).
      - name: Create short build path
        shell: pwsh
        run: |
          New-Item -ItemType Junction -Path C:\rd -Target "$env:GITHUB_WORKSPACE\vendor\rustdesk" | Out-Null
          Get-ChildItem C:\rd | Select-Object -First 3

      - name: Build the client
        shell: pwsh
        working-directory: C:\rd
        run: |
          python build.py --flutter --skip-portable-pack --hwcodec
          if ($LASTEXITCODE -ne 0) { throw "build.py failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path C:\rd\flutter\build\windows\x64\runner\Release\rustdesk.exe)) { throw "rustdesk.exe was not produced" }

      - name: Verify the client is what we intend to ship
        shell: pwsh
        run: ./scripts/verify-client.ps1 -Dir "$env:GITHUB_WORKSPACE\vendor\rustdesk\flutter\build\windows\x64\runner\Release" -ServerHost $env:SERVER_HOST -Key $env:SERVER_KEY

      - name: Package
        shell: pwsh
        run: ./scripts/package-client.ps1

      - name: Upload client zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JustKeepRemote-windows-x64
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    name: Draft GitHub release
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download client zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: JustKeepRemote-windows-x64
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          JustKeepRemote Windows client, built by GitHub Actions run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.

          Based on RustDesk (AGPL-3.0). Corresponding source: this repository at commit ${GITHUB_SHA}
          (patches in \`client/apply-jkr-patches.ps1\`) applied to ${UPSTREAM_REPO} at ${UPSTREAM_REF}
          (hbb_common ${UPSTREAM_HBB_COMMON}).

          Unzip and run JustKeepRemote.exe. Click Install for unattended access and UAC / login-screen control.
          The build is not code-signed, so Windows SmartScreen may warn.
          Verify the download with the .sha256 file.
          EOF
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "JustKeepRemote $TAG" --notes-file notes.md --draft --prerelease
